# CareerFlow AI — everything on one server: Postgres, web, worker, HTTPS.
# Usage (on the server, from the repo root):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: careerflow

x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: careerflow-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://careerflow:${POSTGRES_PASSWORD}@db:5432/careerflow
    STORAGE_DRIVER: local
    LOCAL_STORAGE_DIR: /data/files
    ALLOW_LOCAL_STORAGE: "true"
  volumes:
    - files:/data/files
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerflow
      POSTGRES_DB: careerflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the internet — only reachable by the other containers.

  migrate:
    <<: *app
    restart: "no"
    command: ["npm", "run", "db:migrate"]

  web:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["npm", "run", "start:worker"]
    environment:
      DATABASE_URL: postgres://careerflow:${POSTGRES_PASSWORD}@db:5432/careerflow
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /data/files
      ALLOW_LOCAL_STORAGE: "true"
      PORT: "8080"
    # Chromium for filling application forms needs a little shared memory.
    shm_size: "256m"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./diag:/srv/diag:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    depends_on:
      db: { condition: service_healthy }
    # Nightly compressed dump, keeps the last 14.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U careerflow careerflow | gzip > /backups/careerflow-$$(date +%F).sql.gz
          ls -1t /backups/*.sql.gz | tail -n +15 | xargs -r rm --
          sleep 86400
        done

volumes:
  pgdata:
  files:
  backups:
  caddy_data:
  caddy_config:
