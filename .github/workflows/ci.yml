name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    # Pinned: Playwright's Chromium build doesn't support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: careerflow_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/careerflow_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/careerflow_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium (used by the auto-apply tests and the browser tests)
        run: npx playwright-core install --with-deps chromium
      - name: Unit + integration tests (real Postgres, real Chromium)
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          npm test
      - name: Migrations are in sync with the schema
        run: npm run db:generate && git diff --exit-code packages/db/migrations
      - name: Build web
        run: npm run build
        env:
          APP_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
      - name: Browser smoke test (real Chromium)
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          export APP_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          export APP_HASH_KEY=ci STORAGE_DRIVER=local ALLOW_LOCAL_STORAGE=true LOCAL_STORAGE_DIR=/tmp/cf
          export OPENAI_API_KEY=mock OPENAI_BASE_URL=http://localhost:4010/v1 SEED_SOURCES=off
          node test/e2e/mock-openai.mjs &
          npx tsx test/e2e/make-cv.mts /tmp/real-cv.pdf
          npm run db:migrate
          (cd apps/web && npx next start -p 3000 &) 
          (cd apps/worker && PORT=8080 npx tsx src/main.ts &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npm run e2e && npm run e2e:cv && npm run e2e:discovery && npm run e2e:apply

  docker:
    # Proves the production image builds (the server builds the same Dockerfile).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/Dockerfile -t careerflow-app:ci .
      - name: Chromium works inside the image
        run: docker run --rm careerflow-app:ci sh -c 'chromium --headless=new --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q "<p>ok</p>" && echo chromium-ok'
      - name: Compose file is valid
        run: |
          printf 'SITE_ADDRESS=example.sslip.io\nPOSTGRES_PASSWORD=x\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
