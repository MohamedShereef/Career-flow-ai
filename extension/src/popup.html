<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px/1.4 -apple-system,Segoe UI,Arial,sans-serif;width:320px;margin:12px;color:#1e293b}
h1{font-size:15px;margin:0 0 8px} label{display:block;margin-top:8px;font-weight:600} input{width:100%;box-sizing:border-box;padding:6px;border:1px solid #cbd5e1;border-radius:6px}

  <label>Link code</label><input id="token" placeholder="cfx_…">

</div>

</div>
